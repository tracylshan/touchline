<style>
/* Layout: one phone-width column, sticky scoreboard-style header, fixed bottom tab bar; game view is a big tap grid. */
:root{
  --bg:#F1F4EE; --surface:#FFFFFF; --ink:#14211A; --muted:#5B6A61; --line:#D9E0D6;
  --turf:#1C6B43; --turf-ink:#FFFFFF; --turf-soft:#E2EEE5; --flag:#E8A912; --flag-soft:#FBF0D2;
  --danger:#B3261E; --chip:#E5EBE2;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#151F19; --ink:#E6EEE8; --muted:#97A69C; --line:#26342C;
  --turf:#3FAE72; --turf-ink:#06110B; --turf-soft:#173325; --flag:#F5C451; --flag-soft:#3A3014;
  --danger:#F2867E; --chip:#1E2B24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#151F19; --ink:#E6EEE8; --muted:#97A69C; --line:#26342C;
  --turf:#3FAE72; --turf-ink:#06110B; --turf-soft:#173325; --flag:#F5C451; --flag-soft:#3A3014;
  --danger:#F2867E; --chip:#1E2B24; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:720px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--turf);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-size:26px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.brand b{color:var(--turf)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync i{background:var(--turf)}
button.sync{border:0;background:none;padding:0;font:inherit;font-size:12px;cursor:pointer}
.sync.err{color:var(--danger)} .sync.err i{background:var(--danger)}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.section{display:grid;gap:10px;padding-block:14px}
.section h2{font-size:22px;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--turf);color:var(--turf-ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--turf);color:var(--turf-ink);border-color:var(--turf)}
.btn.ghost{background:none;border-color:transparent;padding-inline:8px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
input[type=text],input[type=url],input[type=number],input[type=date],input[type=time],input[type=datetime-local],textarea,select{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
textarea{min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.field{display:grid;gap:4px;flex:1 1 140px;min-width:0}
.list{display:grid;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.game-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;background:none;text-align:left;width:100%}
.date{display:grid;justify-items:center;line-height:1;font-family:var(--f-display);text-transform:uppercase}
.date .dow{font-size:12px;color:var(--muted);letter-spacing:.06em}
.date .day{font-size:26px;font-weight:700}
.date .mon{font-size:12px;color:var(--muted)}
.mid{min-width:0}
.opp{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.score small{display:block;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.res-W{color:var(--turf)} .res-L{color:var(--danger)}
.when{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.group-h{padding:10px 14px 6px;background:var(--bg)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;display:grid;gap:10px;justify-items:start}
.empty h3{font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:720px}
.tabs button{border:0;background:none;padding:8px 4px;font-family:var(--f-display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-radius:10px}
.crow{cursor:pointer}
.crow:hover td{background:var(--chip)}
tr.sub td{background:var(--bg);font-size:13px;padding-block:6px}
.tbl-wrap th:first-child,.tbl-wrap td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.tbl-wrap tr.sub td:first-child{background:var(--bg)}
.crow:hover td:first-child{background:var(--chip)}
.tabs button.due::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;vertical-align:4px}
.tabs button[aria-current="page"]{color:var(--turf);background:var(--turf-soft)}
/* game view */
.board{background:var(--ink);color:var(--bg);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.board .side{display:grid;gap:6px;justify-items:center;min-width:0}
.board .nm{font-size:13px;font-weight:600;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.board .n{font-family:var(--f-display);font-size:68px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.board .dash{font-family:var(--f-display);font-size:40px;opacity:.5}
.board .pm{display:flex;gap:6px}
.board .pm button{width:40px;height:34px;border-radius:9px;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:none;color:var(--bg);font-size:20px;font-weight:700;line-height:1}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pbtn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;text-align:left;min-height:70px;transition:transform .08s}
.pbtn:active{transform:scale(.97)}
.pbtn .num{grid-row:span 2;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700;background:var(--chip)}
.pbtn .pn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pbtn .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbtn.hot{border-color:var(--flag);background:var(--flag-soft)}
.ptile{position:relative;display:grid}
.ptile .pbtn{padding-right:46px}
.pmore{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;letter-spacing:1px;line-height:1}
.ptile.out .pbtn{opacity:.55;border-style:dashed}
.pbtn .pc{min-width:0}
.card{display:inline-block;width:9px;height:12px;border-radius:2px;vertical-align:-1px}
.card.y{background:#F2C230}.card.r{background:#D33A2F}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.evbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 10px;font-weight:600;text-align:left;display:flex;align-items:center;gap:8px;min-height:48px}
.evbtn:active{transform:scale(.97)}
.sheet{border-color:var(--line);background:var(--chip)}
.oppog{background:none;border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);color:var(--bg);border-radius:9px;font-size:12px;font-weight:600;padding:7px 10px;opacity:.85}
details.who{border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
details.who summary{cursor:pointer}
abbr{text-decoration:none}
.assist{border:1px solid var(--flag);background:var(--flag-soft);border-radius:14px;padding:12px;display:grid;gap:8px}
.flash{animation:flash .6s ease-out}
@keyframes flash{0%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.pbtn{transition:none}}
.logrow{display:flex;gap:10px;align-items:center;padding:10px 14px}
.logrow .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;width:70px;flex:none}
.clk-strip{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);margin-top:6px;padding-top:10px;text-align:left}
.clk-per{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75;min-width:44px}
.clk-time{display:flex;flex-direction:column;justify-content:center;flex:1;min-width:0;line-height:1}
.clk-digits{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.clk-digits.over,.clk-extra{color:var(--flag)} .clk-digits.paused{opacity:.45}
.clk-extra{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.clk-extra:empty{display:none}
.clk-acts{display:flex;gap:6px;align-items:center}
.clk-main{border:0;border-radius:9px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px;padding:8px 14px;white-space:nowrap}
.clk-icon{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:none;color:var(--bg);border-radius:9px;min-width:36px;height:34px;padding:0 8px;font-weight:700;font-size:12px}
.clk-opts{flex-basis:100%;display:flex;gap:6px;justify-content:flex-end}
.clk-opts button{border:1px solid color-mix(in srgb,var(--bg) 30%,transparent);background:none;color:var(--bg);border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600}
.clk-opts button.armed{background:var(--danger);border-color:var(--danger)}
.sharebox input{font-size:13px;font-family:ui-monospace,Menlo,monospace}
.pbtn .num{position:relative}
.capbadge{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--flag);color:#14211A;font-family:var(--f-body);font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.capbadge.static{position:static;display:inline-grid}
.capline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.capline .row{margin-top:6px}
.standings{color:var(--turf);font-weight:600;text-decoration:none}
.standings:hover{text-decoration:underline}
.per-line{font-variant-numeric:tabular-nums}
.logrow .w{flex:1;min-width:0}
.back{display:flex;align-items:center;gap:8px}
.back .btn{white-space:nowrap;flex:none}
.back .meta{min-width:0}
.ttl{font-size:28px;text-transform:uppercase;line-height:1.05}
.notice{background:var(--turf-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.notice.err{background:color-mix(in srgb,var(--danger) 14%,var(--surface))}
.help{font-size:13px;color:var(--muted);margin:0;max-width:62ch}
.feed{padding:12px 14px;display:grid;gap:8px}
.feed .u{font-size:12px;color:var(--muted);word-break:break-all}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rec>div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.rec .big{font-family:var(--f-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.modal{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px}
.modal>div{background:var(--surface);border-radius:16px;padding:16px;display:grid;gap:10px;width:100%;max-width:560px}
.example-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--flag-soft);color:var(--ink);border-radius:6px;padding:2px 6px}
</style>

<body>
<div id="app"></div>
<nav class="tabs" aria-label="Sections"><div class="tabs-in">
  <button data-act="tab" data-tab="games">Games</button>
  <button data-act="tab" data-tab="teams">Teams</button>
  <button data-act="tab" data-tab="stats">Stats</button>
</div></nav>
<input type="file" id="fileIcs" multiple hidden>
<input type="file" id="fileCsv" hidden>
<input type="file" id="fileJson" hidden>

<script>
(function(){
const $app=document.getElementById('app');
const COLORS=['#2F6FDB','#D6453D','#1F9D61','#E08A00','#8A4FD3','#0E9AA7','#C2417F','#6B7A88'];
const LS='touchline.v1';
let S={teams:{}};
let ui={tab:'games',view:'games',teamId:null,gameId:null,filter:'all',when:'upcoming',statsTeam:'all',statsMode:'season',careerLin:'all',careerOpen:null,showArchived:false,newSeason:false,
  assistFor:null,armed:null,paste:null,notice:null,modal:null,flashId:null,};
const rid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- persistence ---------- */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.teams)S=s;}catch(e){}if(!S.firstUse){S.firstUse=Date.now();saveLocal();}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function touch(id){const t=S.teams[id];const now=Date.now();
  if(t){t.updated=now;const g=ui.view==='game'&&ui.teamId===id&&t.games[ui.gameId];if(g)g.updated=now;else t.meta=now;}
  S.lastChange=now;saveLocal();queueSync();}
function backupState(){
  const now=Date.now(),last=S.lastBackup||0,changed=(S.lastChange||0)>last;
  const since=last||S.firstUse||now;const synced=S.sync&&S.sync.on&&S.sync.ok&&now-S.sync.ok<7*864e5;const overdue=!synced&&changed&&now-since>7*864e5;
  const days=last?Math.floor((new Date(now).setHours(0,0,0,0)-new Date(last).setHours(0,0,0,0))/864e5):null;
  const ago=days===null?'never':days===0?'today':days===1?'yesterday':days+' days ago';
  return{last,changed,overdue,ago};
}
function dropTeam(id){delete S.teams[id];(S.deleted=S.deleted||{})[id]=Date.now();S.lastChange=Date.now();saveLocal();queueSync();}

/* ---------- dates ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtTime=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtDay=ts=>{const d=new Date(ts);return DOW[d.getDay()]+' '+MON[d.getMonth()]+' '+d.getDate();};
const isoDate=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const localInput=ts=>isoDate(ts)+'T'+String(new Date(ts).getHours()).padStart(2,'0')+':'+String(new Date(ts).getMinutes()).padStart(2,'0');
function offsetAt(ts,tz){const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});const p={};for(const x of f.formatToParts(new Date(ts)))p[x.type]=x.value;return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)-ts;}
function wallToTs(y,mo,d,h,mi,s,tz){
  if(tz){try{const g=Date.UTC(y,mo-1,d,h,mi,s);const o1=offsetAt(g,tz);let ts=g-o1;const o2=offsetAt(ts,tz);if(o2!==o1)ts=g-o2;return ts;}catch(e){}}
  return new Date(y,mo-1,d,h,mi,s).getTime();
}

/* ---------- ICS ---------- */
function parseICS(text){
  const lines=text.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').split('\n');
  const evs=[];let cur=null;
  for(const raw of lines){
    const line=raw.trimEnd();
    if(line==='BEGIN:VEVENT'){cur={};continue;}
    if(line==='END:VEVENT'){if(cur)evs.push(cur);cur=null;continue;}
    if(!cur)continue;
    let q=false,i=-1;for(let k=0;k<line.length;k++){const c=line[k];if(c==='"')q=!q;else if(c===':'&&!q){i=k;break;}}
    if(i<0)continue;
    const left=line.slice(0,i).split(';'),name=left[0].toUpperCase(),params={};
    for(const p of left.slice(1)){const j=p.indexOf('=');if(j>0)params[p.slice(0,j).toUpperCase()]=p.slice(j+1).replace(/^"|"$/g,'');}
    const v=line.slice(i+1).replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
    if(!cur[name])cur[name]={v,params};
  }
  return evs.map(e=>{
    const ds=e.DTSTART;if(!ds)return null;
    const m=ds.v.match(/^(\d{4})(\d\d)(\d\d)(?:T(\d\d)(\d\d)(\d\d)?(Z)?)?/);if(!m)return null;
    let ts,allDay=false;
    if(!m[4]){allDay=true;ts=new Date(+m[1],+m[2]-1,+m[3],12).getTime();}
    else if(m[7])ts=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0));

function parseCSV(text){

    if(c==='"')q=true;else if(c===delim){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}

  let iN=find(/^(name|player|playername|fullname|athlete)$/),iF=find(/^(first|firstname|given)/),iL=find(/^(last|lastname|surname|family)/),iNum=find(/^(#|no|num|number|jersey|jerseynumber|shirt|uniform)/);

  else{ // no header: number = the mostly-numeric column, name = the first other column

    for(let c=0;c<w;c++){const n=rows.filter(r=>/^#?\d{1,3}$/.test(r[c]||'')).length;if(n>bs){bs=n;best=c;}}
    iNum=bs>=rows.length/2?best:-1;iN=[...Array(w).keys()].find(c=>c!==iNum);

/* ---------- game format & clock ---------- */
function guessFormat(name){const m=String(name||'').match(/\bU-?(\d{1,2})\b/i);return m&&+m[1]<=8?{periods:4,len:12}:{periods:2,len:25};}
const standingsUrl=t=>{const u=String(t.standings||'').trim();return /^https?:\/\/\S+$/i.test(u)?u:'';};
const fmtOf=(t,g)=>(g&&g.format)||t.format||guessFormat(t.name);
const fmtText=f=>`${f.periods} × ${f.len} min ${f.periods===4?'quarters':f.periods===2?'halves':'periods'}`;
function perLabel(f,p){if(p>f.periods)return 'OT'+(p>f.periods+1?p-f.periods:'');return f.periods===4?'Q'+p:f.periods===2?(p===1?'1H':'2H'):'P'+p;}
function perName(f,p){if(p>f.periods)return 'extra time';return f.periods===4?'Q'+p:f.periods===2?(p===1?'1st half':'2nd half'):'period '+p;}
function clockMs(c,now){now=now||Date.now();if(!c)return 0;if(c.state==='running')return Math.max(0,now-c.start-c.pausedMs);if(c.state==='paused')return Math.max(0,c.pausedAt-c.start-c.pausedMs);const l=(c.done||[])[c.done.length-1];return l?Math.max(0,l.end-l.start-l.pausedMs):0;}
function stampNow(g){const c=g.clock;if(!c||c.state==='idle')return null;
  if(c.state==='running'||c.state==='paused')return{p:c.p,s:Math.floor(clockMs(c)/1000)};
  const l=(c.done||[])[c.done.length-1];return l?{p:l.p,s:Math.floor((l.end-l.start-l.pausedMs)/1000)}:null;}
function minuteLabel(f,ps){const m=Math.floor(ps.s/60)+1;return perLabel(f,ps.p)+' '+(ps.p<=f.periods&&m>f.len?`${f.len}+${m-f.len}'`:`${m}'`);}
const stampLabel=(t,g,x)=>x.ps?minuteLabel(fmtOf(t,g),x.ps):fmtTime(x.t);
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};
function periodScores(t,g){
  const f=fmtOf(t,g),scoring=g.goals.map(x=>({ps:x.ps,us:1})).concat((g.events||[]).filter(e=>e.type==='oppgoal'||e.type==='og').map(e=>({ps:e.ps,us:0})));
  const timed=scoring.filter(x=>x.ps);if(!g.clock&&!timed.length)return null;
  const c=g.clock||{};const P=Math.max(c.p||0,...timed.map(x=>x.ps.p),f.periods);
  const rows=[];for(let p=1;p<=P;p++){const inP=timed.filter(x=>x.ps.p===p);const played=p<=(c.p||0)||inP.length;
    if(p>f.periods&&!played)continue;rows.push({label:perLabel(f,p),us:inP.filter(x=>x.us).length,th:inP.filter(x=>!x.us).length,played});}
  const un=scoring.filter(x=>!x.ps);return{rows,untimed:{us:un.filter(x=>x.us).length,th:un.filter(x=>!x.us).length}};
}
const periodLine=(ps,sep)=>ps.rows.map(r=>`${r.label} ${r.played?r.us+'–'+r.th:'–'}`).join(sep||' · ')+(ps.untimed.us+ps.untimed.th?`${sep||' · '}untimed ${ps.untimed.us}–${ps.untimed.th}`:'');
function result(g){const us=g.goals.length,th=theirScore(g);if(!isPast(g)&&!us&&!th)return null;return{us,th,r:us>th?'W':us<th?'L':'D'};}

function pname(t,id){if(!id)return 'Unknown';const p=player(t,id);return p?p.name:'Removed player';}

function tally(g){

const STAT_COLS=[['gp','GP','Games played'],['g','G','Goals'],['a','A','Assists'],['sh','Sh','Shots'],['sog','SOG','Shots on goal'],['pk','PK','Penalties scored / taken'],['sv','Sv','Saves'],['y','YC','Yellow cards'],['r','RC','Red cards'],['og','OG','Own goals']];
function statsFor(teams){
  const rows=[];
  for(const t of teams){const per={};for(const p of t.players)per[p.id]={t,p,gp:0,g:0,a:0,sh:0,sog:0,pk:0,pka:0,sv:0,y:0,r:0,og:0};
    for(const g of Object.values(t.games||{})){
      if(g.cancelled)continue;const c=tally(g);const ab=new Set(g.absent||[]);const played=isPast(g)||g.goals.length||(g.events||[]).length;
      for(const id in per){const r=per[id];if(played&&!ab.has(id))r.gp++;const k=c[id];if(k)for(const f of ['g','a','sh','sog','pk','pka','sv','y','r','og'])r[f]+=k[f];}
    }
    rows.push(...Object.values(per));}
  return rows.sort((a,b)=>b.g-a.g||b.a-a.a||a.p.name.localeCompare(b.p.name));
}

function careerGroups(){
  const lins={};

  const out=[];
  for(const [lin,ts] of Object.entries(lins)){
    const latest=ts.slice().sort((a,b)=>(b.created||0)-(a.created||0))[0];

      g.seasons.sort((a,b)=>(a.t.created||0)-(b.t.created||0));

/* ---------- share card ---------- */
function gameSummary(t,g){
  const r=result(g)||{us:g.goals.length,th:(g.oppGoals||0)+ownGoals(g),r:null};
  const order=[],sc={},as={},sv={};
  for(const x of g.goals.slice().sort((a,b)=>a.t-b.t)){
    const k=x.oppOg?'__og':(x.p||'__unk');if(!sc[k]){sc[k]={n:0,pk:0};order.push(k);}sc[k].n++;if(x.pk)sc[k].pk++;
    if(x.a)as[x.a]=(as[x.a]||0)+1;}
  for(const e of g.events||[])if(e.type==='save'&&e.p)sv[e.p]=(sv[e.p]||0)+1;
  const nm=k=>k==='__og'?'Own goal ('+(g.opp||'opponent')+')':k==='__unk'?'Other player':pname(t,k);
  const scorers=order.map(k=>{const v=sc[k];let s=nm(k);if(v.n>1)s+=' '+v.n;if(v.pk)s+=` (${v.pk>1?v.pk+' ':''}PK)`;return s;});
  const fmt=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([id,n])=>pname(t,id)+(n>1?' '+n:''));
  const ogs=(g.events||[]).filter(e=>e.type==='og').map(e=>pname(t,e.p));
  const list=g.goals.slice().sort((a,b)=>a.t-b.t).map(x=>({name:x.oppOg?'Own goal by '+(g.opp||'opponent'):x.p?pname(t,x.p):'Other player',pk:!!x.pk,a:x.a?pname(t,x.a):'',t:x.t,when:stampLabel(t,g,x)}));
  return{r,scorers,assists:fmt(as),saves:fmt(sv),ogs,list,done:isPast(g),per:periodScores(t,g)};
}
function summaryText(t,g){
  const m=gameSummary(t,g);const d=new Date(g.start);
  const lines=[`${t.name.replace(/ \(example\)$/,'')} ${m.r.us}–${m.r.th} ${g.opp||'Opponent'}${m.r.r&&m.done?' ('+({W:'Win',L:'Loss',D:'Draw'})[m.r.r]+')':''}`,
    d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})+(g.loc?' · '+g.loc:'')];
  if(m.per)lines.push(periodLine(m.per));
  if(g.captain&&player(t,g.captain))lines.push('Captain: '+pname(t,g.captain));
  if(m.list.length){lines.push('','Goals:');m.list.forEach((x,i)=>lines.push(`${i+1}. ${x.name}${x.pk?' (PK)':''}${x.a?', assist '+x.a:''} · ${x.when}`));}
  if(m.saves.length){if(m.list.length)lines.push('');lines.push('Saves: '+m.saves.join(', '));}
  return lines.join('\n');
}
function wrapLines(ctx,text,maxW){const words=text.split(' ');const out=[];let line='';
  for(const w of words){const tryL=line?line+' '+w:w;if(ctx.measureText(tryL).width>maxW&&line){out.push(line);line=w;}else line=tryL;}
  if(line)out.push(line);return out;}
async function drawCard(t,g){

}
function paintCard(t,g,cardH){
  const D='"Barlow Condensed","Arial Narrow",sans-serif',B='"Figtree",system-ui,sans-serif';
  const m=gameSummary(t,g),tn=t.name.replace(/ \(example\)$/,''),on=g.opp||'Opponent';
  const W=1080,H=cardH,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');

  x.fillStyle='#10301F';x.fillRect(0,0,W,H);
  for(let i=0;i*150<H;i++){x.fillStyle=i%2?'rgba(255,255,255,0.025)':'rgba(0,0,0,0)';x.fillRect(0,i*150,W,150);}
  x.strokeStyle='rgba(255,255,255,0.10)';x.lineWidth=6;
  x.strokeRect(40,40,W-80,H-80);
  x.beginPath();x.arc(W/2,H-40,170,Math.PI,0);x.stroke();
  x.beginPath();x.arc(W-40,40,60,Math.PI/2,Math.PI);x.stroke();
  const L=96,R=W-96;let y=150;

  x.fillStyle='#F5C451';x.font=`700 40px ${D}`;x.textBaseline='alphabetic';
  x.fillText((m.done?'FULL TIME':'LIVE SCORE').split('').join(String.fromCharCode(8202)),L,y);
  x.fillStyle='rgba(255,255,255,0.75)';x.font=`500 34px ${B}`;
  const d=new Date(g.start);y+=58;
  x.fillText(d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'})+(g.allDay?'':' · '+fmtTime(g.start)),L,y);
  if(g.loc){y+=46;x.fillText(wrapLines(x,g.loc,R-L)[0],L,y);}
  if(g.captain&&player(t,g.captain)){y+=46;x.fillText('Captain: '+pname(t,g.captain),L,y);}
  // scoreboard rows
  y+=70;
  const row=(name,score,color,win)=>{
    x.fillStyle=color;x.fillRect(L,y,14,170);
    x.font=`700 190px ${D}`;x.textAlign='right';x.fillStyle=win===false?'rgba(255,255,255,0.55)':'#FFFFFF';x.fillText(String(score),R,y+160);
    const sw=x.measureText(String(score)).width;x.textAlign='left';
    let size=76;x.font=`700 ${size}px ${D}`;let lines=wrapLines(x,name.toUpperCase(),R-L-60-sw-40);
    if(lines.length>2){size=60;x.font=`700 ${size}px ${D}`;lines=wrapLines(x,name.toUpperCase(),R-L-60-sw-40).slice(0,2);}
    const top=y+85-(lines.length-1)*size*0.5+size*0.35;
    lines.forEach((ln,i)=>x.fillText(ln,L+46,top+i*size*0.95));
    y+=200;};
  const res=m.r.r&&m.done?m.r.r:null;
  row(tn,m.r.us,t.color,res?res!=='L':null);
  row(on,m.r.th,'rgba(255,255,255,0.35)',res?res!=='W':null);
  if(res){x.font=`700 44px ${D}`;const lbl=({W:'WIN',L:'LOSS',D:'DRAW'})[res];const w=x.measureText(lbl).width+48;
    x.fillStyle=res==='W'?'#3FAE72':res==='L'?'#D9534A':'rgba(255,255,255,0.25)';
    x.beginPath();x.roundRect?x.roundRect(L,y,w,64,32):x.rect(L,y,w,64);x.fill();
    x.fillStyle='#FFFFFF';x.fillText(lbl,L+24,y+47);
    if(m.per){x.font=`500 32px ${B}`;x.fillStyle='rgba(255,255,255,0.75)';const pl=wrapLines(x,periodLine(m.per,'   '),R-L-w-30)[0];x.fillText(pl,L+w+28,y+44);}
    y+=64;}
  else if(m.per){x.font=`500 32px ${B}`;x.fillStyle='rgba(255,255,255,0.75)';x.fillText(wrapLines(x,periodLine(m.per,'   '),R-L)[0],L,y+44);y+=64;}
  y+=60;
  // lists
  const sect=(label,items)=>{if(!items.length)return;
    x.fillStyle='#F5C451';x.font=`700 36px ${D}`;x.fillText(label,L,y);y+=54;
    x.fillStyle='#FFFFFF';x.font=`600 42px ${B}`;
    for(const ln of wrapLines(x,items.join(', '),R-L)){x.fillText(ln,L,y);y+=56;}
    y+=26;};
  if(m.list.length){
    x.fillStyle='#F5C451';x.font=`700 36px ${D}`;x.fillText('GOALS',L,y);y+=58;
    m.list.forEach((g2,i)=>{
      x.textAlign='left';x.fillStyle='#F5C451';x.font=`700 44px ${D}`;x.fillText(String(i+1),L,y);
      x.textAlign='right';x.fillStyle='rgba(255,255,255,0.55)';x.font=`500 32px ${B}`;const tm=g2.when;x.fillText(tm,R,y);const tw=x.measureText(tm).width;
      x.textAlign='left';const nx=L+64,maxW=R-tw-32-nx;
      x.fillStyle='#FFFFFF';x.font=`600 42px ${B}`;let nm=g2.name+(g2.pk?' (PK)':'');
      while(x.measureText(nm).width>maxW&&nm.length>4)nm=nm.slice(0,-2)+'…';
      x.fillText(nm,nx,y);
      if(g2.a){const nw=x.measureText(nm+'  ').width;x.font=`500 32px ${B}`;x.fillStyle='rgba(255,255,255,0.65)';const at='assist '+g2.a;
        if(nw+x.measureText(at).width<=maxW)x.fillText(at,nx+nw,y);else{y+=40;x.fillText(at,nx,y);}}

}

document.addEventListener('change',e=>{
